<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Random Access Memories</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main class="app">
        <header class="app-header">
            <div>
                <p class="eyebrow">Your personal workspace</p>

                <h1>Random Access Memories</h1>

                <p class="subtitle">
                    Keep track of notes, reminders, and everyday tasks.
                </p>
            </div>

        </header>

        <section class="workspace">
            <section class="panel">
                <div class="section-heading">
                    <div>
                        <p class="eyebrow">01</p>
                        <h2>Reminders</h2>
                    </div>

                    <p class="section-note">
                        Keep track of important reminders.
                    </p>
                </div>

                <form id="reminder-form" class="form-grid">
                    <label>
                        Reminder
                        <input
                            id="reminder-text"
                            type="text"
                            placeholder="Remind me to..."
                            required
                        >
                    </label>

                    <label>
                        Time
                        <input
                            id="reminder-time"
                            type="datetime-local"
                            required
                        >
                    </label>

                    <button type="submit">
                        Save reminder
                    </button>
                </form>

                <div
                    id="reminders-container"
                    class="entries"
                ></div>
            </section>

            <section class="panel">
                <div class="section-heading">
                    <div>
                        <p class="eyebrow">02</p>
                        <h2>Notes</h2>
                    </div>

                    <p class="section-note">
                        Write down anything you want to remember.
                    </p>
                </div>

                <form id="note-form" class="form-grid">
                    <label>
                        Title
                        <input
                            id="note-title"
                            type="text"
                            placeholder="Memory title"
                            required
                        >
                    </label>

                    <label>
                        Topic
                        <input
                            id="note-topic"
                            type="text"
                            placeholder="Optional topic"
                        >
                    </label>

                    <label>
                        Content
                        <textarea
                            id="note-content"
                            rows="5"
                            placeholder="Write something worth remembering..."
                            required
                        ></textarea>
                    </label>

                    <label>
                        Priority
                        <select id="note-priority">
                            <option value="low">Low</option>
                            <option value="medium" selected>
                                Medium
                            </option>
                            <option value="high">High</option>
                        </select>
                    </label>

                    <button type="submit">
                        Save note
                    </button>
                </form>

                <div
                    id="notes-container"
                    class="entries"
                ></div>
            </section>

            <section class="panel">
                <div class="section-heading">
                    <div>
                        <p class="eyebrow">03</p>
                        <h2>Lists and tasks</h2>
                    </div>

                    <p class="section-note">
                        Organize tasks and everyday errands.
                    </p>
                </div>

                <form id="list-form" class="form-grid">
                    <label>
                        List title
                        <input
                            id="list-title"
                            type="text"
                            placeholder="Shopping, work, errands..."
                            required
                        >
                    </label>

                    <button type="submit">
                        Create list
                    </button>
                </form>

                <div
                    id="lists-container"
                    class="entries"
                ></div>
            </section>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
